---
# Offline checks on every push: shell, YAML, Ansible syntax, OpenTofu
# format and validation against the real provider schema. Nothing here
# talks to the cluster.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install shellcheck, yamllint and ansible-core
        run: pip install shellcheck-py yamllint ansible-core

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - name: make check
        run: make check
