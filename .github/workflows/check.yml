---
# Offline checks on every push: shell, YAML, Ansible syntax and lint
# (production profile), OpenTofu format and validation against the real
# provider schema. Nothing here talks to the cluster. Actions are pinned to
# commit SHAs; Dependabot (.github/dependabot.yml) proposes updates.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per branch: a new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # nothing here pushes; don't leave the token on disk

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the pinned CI tools
        run: pip install -r .github/requirements-ci.txt

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - name: make check
        run: make check
