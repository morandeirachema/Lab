---
# Every host and its address. OpenTofu reads this file too (node addresses for
# SSH and VXLAN peers, the gateway's LAN address), so this is the only place
# addresses are written. All addresses are placeholders: use static IPs
# outside your router's DHCP pool.
#
# pve3 (Beelink Mini S13 Pro) goes under proxmox when it arrives: 192.168.1.13.
all:
  children:
    proxmox:
      hosts:
        pve1:  # Beelink Mini S12 Pro #1
          ansible_host: 192.168.1.11
        pve2:  # Beelink Mini S12 Pro #2
          ansible_host: 192.168.1.12
      vars:
        ansible_user: root
    nas:
      hosts:
        ds224:  # Synology DS224+; not managed by Ansible, listed for its address
          ansible_host: 192.168.1.219
    lab_gateway:
      hosts:
        labgw:  # container created by OpenTofu (terraform/gateway.tf)
          ansible_host: 192.168.1.20
      vars:
        ansible_user: root
