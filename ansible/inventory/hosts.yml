---
# Proxmox nodes. Names must match the node hostnames (pve1, pve2, ...).
# Addresses are placeholders: use the static IPs you give the nodes at install.
# pve3 (Beelink Mini S13 Pro) goes here when it arrives: ansible_host 192.168.1.13.
all:
  children:
    proxmox:
      hosts:
        pve1:  # Beelink Mini S12 Pro #1
          ansible_host: 192.168.1.11
        pve2:  # Beelink Mini S12 Pro #2
          ansible_host: 192.168.1.12
      vars:
        ansible_user: root
