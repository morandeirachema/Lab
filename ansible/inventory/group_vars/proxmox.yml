---
# Settings for every Proxmox node. Role defaults (roles/*/defaults/main.yml)
# document each knob; override them here or per node in host_vars/.

pve_base_full_upgrade: true
pve_base_reboot: false            # true = reboot one node at a time when the upgrade changed something
pve_base_zfs_arc_max_gib: 2       # 0 = leave the installer's value
pve_base_ssh_disable_passwords: false   # flip to true once key login works for you

tailscale_enabled: false          # see docs/06-remote-management.md
