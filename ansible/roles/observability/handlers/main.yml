---
- name: Reload systemd for observability
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart loki
  ansible.builtin.systemd_service:
    name: loki
    state: restarted

- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted

- name: Restart alloy
  ansible.builtin.systemd_service:
    name: alloy
    state: restarted

- name: Restart grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
