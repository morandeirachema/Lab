---
# Logs and metrics are kept this long (Loki retention_period, Prometheus
# --storage.tsdb.retention.time). Prometheus also stops at a size cap.
observability_retention_days: 14
observability_prometheus_retention_size: 10GB

# The receivers' ports come from config/lab.yml (observability.syslog_port and
# otlp_port), the same values the gateway and Proxmox's metric server use.

# Must match what the sender is set to. WALLIX's SIEM settings have a log format
# choice; the Splunk add-on in the WALLIX GitHub organisation documents
# "RFC 5424 or legacy". Alloy's values: rfc5424 or rfc3164 (legacy BSD syslog).
observability_syslog_format: rfc5424

# Loki's data. The packaged config uses /tmp/loki, but /tmp is a RAM tmpfs on
# Debian 13, so the data would be lost on reboot and would eat the VM's memory.
observability_loki_dir: /var/lib/loki

# Grafana's admin password, read from the environment of the machine running
# Ansible and never stored in the repo. It goes to /etc/grafana/admin_password
# (root:grafana 0640); Grafana applies it once, on first run.
observability_grafana_admin_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}"
