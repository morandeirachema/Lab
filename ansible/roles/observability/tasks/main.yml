---
# Expects config/lab.yml loaded as `lab` (see playbooks/observability.yml).

# Checked before anything changes: a failed check later in the run would drop the
# restart handlers already notified, and a re-run would not restart those services.
# The admin password lives in a root-owned file that Grafana reads through its
# documented file provider ($__file{}). A systemd Environment= line would expose
# it: systemd.exec(5) warns that unit environment variables are "exposed to
# unprivileged clients via D-Bus IPC" and are "not suitable for passing secrets".
- name: Look for Grafana's admin password file
  ansible.builtin.stat:
    path: /etc/grafana/admin_password
  register: observability_grafana_pwfile

- name: Require an admin password for Grafana's first run
  ansible.builtin.assert:
    that: >-
      observability_grafana_pwfile.stat.exists and observability_grafana_admin_password | length == 0
      or observability_grafana_admin_password is match('^\S{12,}$')
    fail_msg: >-
      Before the first run, export GRAFANA_ADMIN_PASSWORD (12 or more characters, no
      spaces), so Grafana never starts with admin/admin.

# --- Packages: Grafana's APT repository (grafana, loki, alloy) + Debian's prometheus
# Repository setup as in Grafana's Debian install docs.
- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Grafana's signing key (re-checked every run, so a rotated key is picked up)
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"
    force: true

- name: Add Grafana's repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main

- name: Install Grafana, Loki, Alloy and Prometheus
  ansible.builtin.apt:
    name: [grafana, loki, alloy, prometheus]
    state: present
    update_cache: true

# --- Loki --------------------------------------------------------------------
- name: Loki data directory (not /tmp, which is RAM on Debian 13)
  ansible.builtin.file:
    path: "{{ observability_loki_dir }}"
    state: directory
    owner: loki
    mode: "0750"

- name: Loki configuration
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: /etc/loki/config.yml
    mode: "0644"
  notify: Restart loki

# --- Prometheus: accepts Alloy's remote write (Debian 13's build has no OTLP receiver)
- name: Prometheus arguments
  vars:
    observability_prometheus_args:
      # Only Alloy and Grafana, on this VM, talk to Prometheus: keep it off the network.
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time={{ observability_retention_days | int }}d
      - --storage.tsdb.retention.size={{ observability_prometheus_retention_size }}
  ansible.builtin.copy:
    dest: /etc/default/prometheus
    mode: "0644"
    content: |
      # Managed by Ansible (observability)
      ARGS="{{ observability_prometheus_args | join(' ') }}"
  notify: Restart prometheus

- name: Directory for Alloy's systemd drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    mode: "0755"

# --- Alloy: syslog -> Loki, OTLP metrics -> Prometheus ---------------------------
- name: Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    mode: "0644"
  notify: Restart alloy

- name: Let Alloy bind the syslog port (below 1024; its unit grants no capabilities)
  ansible.builtin.copy:
    dest: /etc/systemd/system/alloy.service.d/10-bind-syslog.conf
    mode: "0644"
    content: |
      # Managed by Ansible (observability)
      [Service]
      AmbientCapabilities=CAP_NET_BIND_SERVICE
  notify:
    - Reload systemd for observability
    - Restart alloy

# --- Grafana ------------------------------------------------------------------
- name: Provision the Prometheus and Loki data sources
  ansible.builtin.template:
    src: datasources.yaml.j2
    dest: /etc/grafana/provisioning/datasources/lab.yaml
    mode: "0644"
  notify: Restart grafana

- name: Provisioning directories for alert rules and dashboards
  ansible.builtin.file:
    path: /etc/grafana/provisioning/{{ item }}
    state: directory
    mode: "0755"
  loop: [alerting, dashboards]

- name: Provision the alert rules
  ansible.builtin.template:
    src: alerting.yaml.j2
    dest: /etc/grafana/provisioning/alerting/lab.yaml
    mode: "0644"
  notify: Restart grafana

- name: Provision the dashboards folder
  ansible.builtin.template:
    src: dashboards.yaml.j2
    dest: /etc/grafana/provisioning/dashboards/lab.yaml
    mode: "0644"
  notify: Restart grafana

- name: Dashboards from the repo
  ansible.builtin.import_tasks: dashboards.yml

- name: Grafana admin password file (root:grafana 0640)
  ansible.builtin.copy:
    dest: /etc/grafana/admin_password
    content: "{{ observability_grafana_admin_password }}"
    owner: root
    group: grafana
    mode: "0640"
  when: observability_grafana_admin_password | length > 0
  no_log: true
  notify: Restart grafana

- name: Read admin_password from that file ($__file provider; applied on first run)
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?admin_password\s*='
    line: "admin_password = $__file{/etc/grafana/admin_password}"
    insertafter: '^\[security\]'
  notify: Restart grafana

- name: Remove the earlier Environment= drop-in, if a previous run left one
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d/10-admin.conf
    state: absent
  notify:
    - Reload systemd for observability
    - Restart grafana

- name: Apply configuration changes before starting the services
  ansible.builtin.meta: flush_handlers

- name: Start the stack at boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [loki, prometheus, alloy, grafana-server]
