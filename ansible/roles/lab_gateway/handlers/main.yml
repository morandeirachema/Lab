---
- name: Reload sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-labgw.conf
  changed_when: true

- name: Restart nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: restarted

- name: Restart dnsmasq
  ansible.builtin.systemd_service:
    name: dnsmasq
    state: restarted
