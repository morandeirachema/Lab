---
# Automatic security updates for the lab's long-running Debian guests
# (the gateway container, the observability VM, the DevOps VMs). The two APT::Periodic
# lines are the "Manual Setup" in unattended-upgrades' README; which origins
# get upgraded stays the package default (/etc/apt/apt.conf.d/50unattended-upgrades),
# so third-party repositories such as Grafana's are not upgraded unattended.
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Turn on the daily update check and unattended upgrade
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      // Managed by Ansible (debian_autoupdates)
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# The lab roles edit some packages' conffiles (/etc/nftables.conf,
# /etc/default/prometheus). unattended-upgrades "holds back any package" whose
# upgrade would prompt about a conffile, so those security updates would never
# install. Its README's documented answer: keep the old conffile.
- name: Keep the managed config files on upgrades, so nothing is held back
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"
    content: |
      // Managed by Ansible (debian_autoupdates)
      Dpkg::Options {"--force-confold"};
