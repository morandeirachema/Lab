---
# Off until you opt in (group_vars/proxmox.yml: tailscale_enabled: true).
tailscale_enabled: false

# A Tailscale auth key, read from the environment of the machine running
# Ansible; never stored in this repo. Only needed the first time a node joins.
tailscale_auth_key: "{{ lookup('ansible.builtin.env', 'TS_AUTHKEY') }}"

# Debian suite for https://pkgs.tailscale.com/stable/debian
tailscale_suite: trixie

# Keep the node's own /etc/resolv.conf: a hypervisor should not depend on
# MagicDNS to resolve its own mirrors.
tailscale_accept_dns: false

# The subnet router (one node: inventory/host_vars/pve1.yml) advertises the
# LAN and every routed lab net, from config/lab.yml; isolated nets are never
# advertised. Each route must then be approved in the Tailscale admin console.
tailscale_subnet_router: false
tailscale_advertise_routes: "{{ ([lab.lan.cidr] + lab_routed_nets) if tailscale_subnet_router | bool else [] }}"
