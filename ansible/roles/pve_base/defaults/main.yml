---
# Proxmox VE major version and Debian suite this role is written for.
pve_base_major: 9
pve_base_suite: trixie
# Ceph release repo: the Package_Repositories wiki marks ceph-tentacle as recommended (Oct 2026).
pve_base_ceph_release: ceph-tentacle

# apt full-upgrade on every run; reboot afterwards only if asked to.
pve_base_full_upgrade: true
pve_base_reboot: false

pve_base_packages:
  - jq            # for pvesh/pveum --output-format json by hand
  - git
  - rsync
  - vim
  - tmux
  - htop
  - iperf3        # measure the link between nodes
  - ethtool
  - lm-sensors

pve_base_swappiness: 10

# Upper limit for the ZFS ARC in GiB on ZFS-installed nodes; 0 leaves it alone.
pve_base_zfs_arc_max_gib: 2

# Routes on the node to every lab net the gateway routes (config/lab.yml
# gateway.nets, via the labgw address in the inventory). The nodes need them to
# push metrics to the observability VM and to reach lab guests.
pve_base_lab_routes: true

# Register the node's NIC for Wake-on-LAN, so another node can wake it with
# `pvenode wakeonlan <node>` (docs/07-remote-management.md). The NIC is the
# physical port of the LAN bridge.
pve_base_wakeonlan: true
pve_base_wakeonlan_bridge: "{{ lab.lan.bridge | default('vmbr0') }}"

# Extra static routes, e.g. for a Tailscale subnet router:
#   pve_base_static_routes:
#     - { net: 172.16.0.0/24, via: 192.168.1.30 }
pve_base_static_routes: []

# Netfilter modules the lab gateway (an unprivileged container) needs for NAT
# and connection tracking; a container cannot load kernel modules itself.
pve_base_kernel_modules:
  - nf_tables
  - nft_ct
  - nft_chain_nat
  - nft_masq
  - nf_nat
  - nf_conntrack

# Key-only SSH for root. Leave false until you have logged in with your key.
pve_base_ssh_disable_passwords: false
