---
- name: Check this is Proxmox VE {{ pve_base_major }}
  ansible.builtin.command: pveversion
  register: pve_base_version
  changed_when: false
  failed_when: >-
    pve_base_version.rc != 0 or
    ('pve-manager/' ~ pve_base_major ~ '.') not in pve_base_version.stdout

# --- Repositories (no subscription) ------------------------------------------
- name: Look for the enterprise repository the installer adds
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
  register: pve_base_enterprise_repo

- name: Disable the enterprise repository (needs a subscription)
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
    regexp: '^Enabled:'
    line: 'Enabled: false'
    insertafter: '^Types:'
    mode: "0644"
  when: pve_base_enterprise_repo.stat.exists

- name: Use the pve-no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ pve_base_suite }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: Point the Ceph repository at no-subscription too
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ceph.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/ceph-squid
      Suites: {{ pve_base_suite }}
      Components: no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

# --- Packages ------------------------------------------------------------------
- name: Upgrade all packages (apt full-upgrade)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  register: pve_base_upgrade
  when: pve_base_full_upgrade | bool

- name: Install admin tools
  ansible.builtin.apt:
    name: "{{ pve_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Kernel tunables ---------------------------------------------------------------
- name: Prefer RAM over swap
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-homelab.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      vm.swappiness = {{ pve_base_swappiness }}
  notify: Reload sysctl

- name: Detect ZFS
  ansible.builtin.stat:
    path: /sys/module/zfs
  register: pve_base_zfs

- name: Cap the ZFS ARC so guests keep their RAM
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      options zfs zfs_arc_max={{ (pve_base_zfs_arc_max_gib | int) * 1024 * 1024 * 1024 }}
  when: pve_base_zfs.stat.exists and (pve_base_zfs_arc_max_gib | int) > 0
  notify:
    - Apply ZFS ARC limit
    - Update initramfs

# --- Kernel modules for the lab gateway --------------------------------------
- name: Load the lab gateway's netfilter modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/lab-gateway.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      {{ pve_base_kernel_modules | join('\n') }}

- name: Load them now
  ansible.builtin.command: modprobe {{ item }}
  loop: "{{ pve_base_kernel_modules }}"
  changed_when: false

# --- Static routes (optional) -------------------------------------------------
- name: Install the lab routes unit
  ansible.builtin.template:
    src: lab-routes.service.j2
    dest: /etc/systemd/system/lab-routes.service
    mode: "0644"
  when: pve_base_static_routes | length > 0
  notify:
    - Reload systemd
    - Restart lab routes

- name: Remove the lab routes unit when no routes are configured
  ansible.builtin.file:
    path: /etc/systemd/system/lab-routes.service
    state: absent
  when: pve_base_static_routes | length == 0
  notify: Reload systemd

# --- SSH --------------------------------------------------------------------
- name: Key-only SSH for root
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  when: pve_base_ssh_disable_passwords | bool
  notify: Restart sshd

- name: Restore password SSH when key-only is turned off
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/10-homelab.conf
    state: absent
  when: not (pve_base_ssh_disable_passwords | bool)
  notify: Restart sshd

# --- Reboot (optional) --------------------------------------------------------
- name: Flush handlers before a reboot
  ansible.builtin.meta: flush_handlers

- name: Reboot after the upgrade
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - pve_base_reboot | bool
    - pve_base_upgrade is changed
