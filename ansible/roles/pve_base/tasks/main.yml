---
- name: Check this is Proxmox VE {{ pve_base_major }}
  ansible.builtin.command: pveversion
  register: pve_base_version
  changed_when: false
  failed_when: >-
    pve_base_version.rc != 0 or
    ('pve-manager/' ~ pve_base_major ~ '.') not in pve_base_version.stdout

# --- Repositories (no subscription) ------------------------------------------
- name: Look for the enterprise repository the installer adds
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
  register: pve_base_enterprise_repo

# "Enabled: no" is how the Package_Repositories wiki page says to disable one.
- name: Disable the enterprise repository (needs a subscription)
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
    regexp: '^Enabled:'
    line: 'Enabled: no'
    insertafter: '^Types:'
    mode: "0644"
  when: pve_base_enterprise_repo.stat.exists

- name: Use the pve-no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ pve_base_suite }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

# The installer's Ceph entry points at the enterprise repo, which fails
# without a subscription. Ceph is not used here; this keeps apt clean.
- name: Point the Ceph repository at no-subscription too
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ceph.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/{{ pve_base_ceph_release }}
      Suites: {{ pve_base_suite }}
      Components: no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

# --- Packages ------------------------------------------------------------------
- name: Upgrade all packages (apt full-upgrade)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  register: pve_base_upgrade
  when: pve_base_full_upgrade | bool

- name: Install admin tools
  ansible.builtin.apt:
    name: "{{ pve_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Kernel tunables ---------------------------------------------------------------
- name: Prefer RAM over swap
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-homelab.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      vm.swappiness = {{ pve_base_swappiness }}
  notify: Reload sysctl

- name: Detect ZFS
  ansible.builtin.stat:
    path: /sys/module/zfs
  register: pve_base_zfs

- name: Cap the ZFS ARC so guests keep their RAM
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      options zfs zfs_arc_max={{ (pve_base_zfs_arc_max_gib | int) * 1024 * 1024 * 1024 }}
  when: pve_base_zfs.stat.exists and (pve_base_zfs_arc_max_gib | int) > 0
  notify:
    - Apply ZFS ARC limit
    - Update initramfs

# --- Kernel modules for the lab gateway --------------------------------------
- name: Load the lab gateway's netfilter modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/lab-gateway.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      {% for module in pve_base_kernel_modules %}
      {{ module }}
      {% endfor %}

- name: Load them now
  ansible.builtin.command: modprobe {{ item }}
  loop: "{{ pve_base_kernel_modules }}"
  changed_when: false

# --- Routes to the lab nets ---------------------------------------------------
# Network address of each routed gateway net, e.g. 10.10.10.1/24 -> 10.10.10.0/24
# (plain arithmetic: Jinja has no bitwise operators). Isolated nets get no
# route: labgw forwards nothing to them.
- name: The lab nets can be routed (config/lab.yml loaded, labgw in the inventory)
  ansible.builtin.assert:
    that:
      - lab is defined
      - "'labgw' in hostvars"
    fail_msg: >-
      pve_base_lab_routes is on, but config/lab.yml isn't loaded as `lab` or the inventory has
      no labgw host. Run pve-postinstall.yml, or set pve_base_lab_routes: false.
  when: pve_base_lab_routes | bool
  tags: [routes]

- name: Work out the routes to the lab nets
  tags: [routes]
  ansible.builtin.set_fact:
    pve_base_routes: "{{ pve_base_static_routes + pve_base_lab_net_routes }}"
  vars:
    pve_base_lab_net_routes: >-
      {%- set out = [] -%}
      {%- if pve_base_lab_routes | bool -%}
      {%-   for net in lab.gateway.nets if not net.isolated | default(false) -%}
      {%-     set ip, prefix = net.address.split('/') -%}
      {%-     set o = ip.split('.') | map('int') | list -%}
      {%-     set n = o[0] * 16777216 + o[1] * 65536 + o[2] * 256 + o[3] -%}
      {%-     set base = n - (n % (2 ** (32 - (prefix | int)))) -%}
      {%-     set octets = [base // 16777216, base // 65536 % 256, base // 256 % 256, base % 256] -%}
      {%-     set network = (octets | join('.')) ~ '/' ~ prefix -%}
      {%-     set _ = out.append({'net': network, 'via': hostvars['labgw'].ansible_host}) -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ out }}

- name: Install the lab routes unit
  ansible.builtin.template:
    src: lab-routes.service.j2
    dest: /etc/systemd/system/lab-routes.service
    mode: "0644"
  when: pve_base_routes | length > 0
  notify:
    - Reload systemd
    - Restart lab routes
  tags: [routes]

- name: Look for a lab routes unit
  ansible.builtin.stat:
    path: /etc/systemd/system/lab-routes.service
  register: pve_base_routes_unit
  when: pve_base_routes | length == 0
  tags: [routes]

- name: Stop it first, so its routes go (no routes configured any more)
  ansible.builtin.systemd_service:
    name: lab-routes.service
    state: stopped
    enabled: false
  when: pve_base_routes | length == 0 and pve_base_routes_unit.stat.exists
  tags: [routes]

- name: Remove the lab routes unit when there are no routes
  ansible.builtin.file:
    path: /etc/systemd/system/lab-routes.service
    state: absent
  when: pve_base_routes | length == 0
  notify: Reload systemd
  tags: [routes]

# --- SSH --------------------------------------------------------------------
- name: Key-only SSH for root
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  when: pve_base_ssh_disable_passwords | bool
  notify: Restart sshd

- name: Restore password SSH when key-only is turned off
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/10-homelab.conf
    state: absent
  when: not (pve_base_ssh_disable_passwords | bool)
  notify: Restart sshd

# --- Reboot (optional) --------------------------------------------------------
- name: Flush handlers before a reboot
  ansible.builtin.meta: flush_handlers

- name: Reboot after the upgrade
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - pve_base_reboot | bool
    - pve_base_upgrade is changed
