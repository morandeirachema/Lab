---
- name: Check this is Proxmox VE {{ pve_base_major }}
  ansible.builtin.command: pveversion
  register: pve_base_version
  changed_when: false
  failed_when: >-
    pve_base_version.rc != 0 or
    ('pve-manager/' ~ pve_base_major ~ '.') not in pve_base_version.stdout

# --- Repositories (no subscription) ------------------------------------------
- name: Look for the enterprise repository the installer adds
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
  register: pve_base_enterprise_repo

# "Enabled: no" is how the Package_Repositories wiki page says to disable one.
- name: Disable the enterprise repository (needs a subscription)
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
    regexp: '^Enabled:'
    line: 'Enabled: no'
    insertafter: '^Types:'
    mode: "0644"
  when: pve_base_enterprise_repo.stat.exists

- name: Use the pve-no-subscription repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ pve_base_suite }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

# The installer's Ceph entry points at the enterprise repo, which fails
# without a subscription. Ceph is not used here; this keeps apt clean.
- name: Point the Ceph repository at no-subscription too
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ceph.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/{{ pve_base_ceph_release }}
      Suites: {{ pve_base_suite }}
      Components: no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

# --- Packages ------------------------------------------------------------------
- name: Upgrade all packages (apt full-upgrade)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  register: pve_base_upgrade
  when: pve_base_full_upgrade | bool

- name: Install admin tools
  ansible.builtin.apt:
    name: "{{ pve_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Kernel tunables ---------------------------------------------------------------
- name: Prefer RAM over swap
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-homelab.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      vm.swappiness = {{ pve_base_swappiness }}
  notify: Reload sysctl

- name: Detect ZFS
  ansible.builtin.stat:
    path: /sys/module/zfs
  register: pve_base_zfs

- name: Cap the ZFS ARC so guests keep their RAM
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      options zfs zfs_arc_max={{ (pve_base_zfs_arc_max_gib | int) * 1024 * 1024 * 1024 }}
  when: pve_base_zfs.stat.exists and (pve_base_zfs_arc_max_gib | int) > 0
  notify:
    - Apply ZFS ARC limit
    - Update initramfs

# --- Kernel modules for the lab gateway --------------------------------------
- name: Load the lab gateway's netfilter modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/lab-gateway.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      {% for module in pve_base_kernel_modules %}
      {{ module }}
      {% endfor %}

- name: Load them now
  ansible.builtin.command: modprobe {{ item }}
  loop: "{{ pve_base_kernel_modules }}"
  changed_when: false

# --- Routes to the lab nets ---------------------------------------------------
# One route via labgw per routed gateway net (lab_routed_nets, from
# inventory/group_vars/all.yml). Isolated nets get none: labgw forwards
# nothing to them.
- name: The lab nets can be routed (labgw in the inventory)
  ansible.builtin.assert:
    that: "'labgw' in hostvars"
    fail_msg: >-
      pve_base_lab_routes is on, but the inventory has no labgw host. Add it, or set
      pve_base_lab_routes: false.
  when: pve_base_lab_routes | bool
  tags: [routes]

- name: Work out the routes to the lab nets
  tags: [routes]
  ansible.builtin.set_fact:
    pve_base_routes: "{{ pve_base_static_routes + pve_base_lab_net_routes }}"
  vars:
    pve_base_lab_net_routes: >-
      {%- set out = [] -%}
      {%- if pve_base_lab_routes | bool -%}
      {%-   for network in lab_routed_nets -%}
      {%-     set _ = out.append({'net': network, 'via': hostvars['labgw'].ansible_host}) -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ out }}

- name: Install the lab routes unit
  ansible.builtin.template:
    src: lab-routes.service.j2
    dest: /etc/systemd/system/lab-routes.service
    mode: "0644"
  when: pve_base_routes | length > 0
  notify:
    - Reload systemd
    - Restart lab routes
  tags: [routes]

- name: Look for a lab routes unit
  ansible.builtin.stat:
    path: /etc/systemd/system/lab-routes.service
  register: pve_base_routes_unit
  when: pve_base_routes | length == 0
  tags: [routes]

- name: Stop it first, so its routes go (no routes configured any more)
  ansible.builtin.systemd_service:
    name: lab-routes.service
    state: stopped
    enabled: false
  when: pve_base_routes | length == 0 and pve_base_routes_unit.stat.exists
  tags: [routes]

- name: Remove the lab routes unit when there are no routes
  ansible.builtin.file:
    path: /etc/systemd/system/lab-routes.service
    state: absent
  when: pve_base_routes | length == 0
  notify: Reload systemd
  tags: [routes]

# --- Wake-on-LAN --------------------------------------------------------------
# pvenode(1): wakeonlan = "[mac=]<MAC address> [,bind-interface=...]".
# The bridge's ports include tap/veth devices; only a physical NIC has a
# device link in sysfs.
- name: Find the MAC of the physical NIC behind the LAN bridge
  ansible.builtin.shell: |
    for port in /sys/class/net/{{ pve_base_wakeonlan_bridge }}/brif/*; do
      name=${port##*/}
      [ -e "/sys/class/net/$name/device" ] && cat "/sys/class/net/$name/address"
    done
    exit 0
  args:
    executable: /bin/bash
  register: pve_base_wol_mac
  changed_when: false
  when: pve_base_wakeonlan | bool

- name: Read the node's Wake-on-LAN setting
  ansible.builtin.command: pvenode config get --property wakeonlan
  register: pve_base_wol_current
  changed_when: false
  when: pve_base_wakeonlan | bool and pve_base_wol_mac.stdout_lines | length == 1

- name: Register the NIC for Wake-on-LAN
  ansible.builtin.command: pvenode config set --wakeonlan {{ pve_base_wol_mac.stdout | trim }}
  changed_when: true
  when:
    - pve_base_wakeonlan | bool
    - pve_base_wol_mac.stdout_lines | length == 1
    - (pve_base_wol_mac.stdout | trim | lower) not in (pve_base_wol_current.stdout | lower)

- name: Say why Wake-on-LAN was left alone
  ansible.builtin.debug:
    msg: >-
      {{ pve_base_wol_mac.stdout_lines | length }} physical NICs behind
      {{ pve_base_wakeonlan_bridge }}, expected one: set it by hand with
      pvenode config set --wakeonlan <MAC>.
  when: pve_base_wakeonlan | bool and pve_base_wol_mac.stdout_lines | length != 1

# --- SSH --------------------------------------------------------------------
- name: Key-only SSH for root
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-homelab.conf
    mode: "0644"
    content: |
      # Managed by Ansible (pve_base)
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    validate: /usr/sbin/sshd -t -f %s
  when: pve_base_ssh_disable_passwords | bool
  notify: Restart sshd

- name: Restore password SSH when key-only is turned off
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/10-homelab.conf
    state: absent
  when: not (pve_base_ssh_disable_passwords | bool)
  notify: Restart sshd

# --- Reboot (optional) --------------------------------------------------------
- name: Flush handlers before a reboot
  ansible.builtin.meta: flush_handlers

- name: Reboot after the upgrade
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - pve_base_reboot | bool
    - pve_base_upgrade is changed
