---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Apply ZFS ARC limit
  ansible.builtin.shell: >-
    echo {{ (pve_base_zfs_arc_max_gib | int) * 1024 * 1024 * 1024 }}
    > /sys/module/zfs/parameters/zfs_arc_max
  changed_when: true

- name: Update initramfs
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart lab routes
  ansible.builtin.systemd_service:
    name: lab-routes.service
    state: restarted
    enabled: true

- name: Restart sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
