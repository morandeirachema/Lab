---
# Baseline for every Proxmox node: repositories, updates, tools, kernel and
# SSH settings. One node at a time, so a reboot never takes the cluster down.
#
#   cd ansible && ansible-playbook playbooks/pve-postinstall.yml [--limit pve3]
#   ... --tags routes     only the routes to the lab nets (make routes)
- name: Proxmox VE post-install baseline
  hosts: proxmox
  serial: 1
  pre_tasks:
    - name: Load config/lab.yml (the lab nets to route)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../config/lab.yml"
        name: lab
      tags: [always]
  roles:
    - role: pve_base
