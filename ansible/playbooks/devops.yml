---
# The DevOps lab's VMs (terraform/cloud_vms.tf): security updates, then k3s
# (the server first, so the agents can read its join token), then Forgejo
# with its Actions runner.
#
#   make lab LAB=devops CMD=start && make devops
#   export KUBECONFIG=~/.config/lab/kubeconfig && kubectl get nodes
#   open http://10.10.20.20:3000/   (labadmin; ~/.config/lab/forgejo-admin-password)
- name: Security updates on the DevOps VMs
  hosts: devops
  roles:
    - role: debian_autoupdates

- name: The k3s server
  hosts: k3s_server
  roles:
    - role: k3s
      vars:
        k3s_role: server

- name: The k3s agents
  hosts: k3s_agents
  roles:
    - role: k3s
      vars:
        k3s_role: agent

- name: The forge
  hosts: forgejo
  roles:
    - role: forgejo
