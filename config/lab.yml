---
# The lab, declared once. OpenTofu (terraform/) builds the Proxmox objects from
# it and Ansible (ansible/) configures what runs inside them. Host addresses
# live in ansible/inventory/hosts.yml, which OpenTofu reads too.
#
# Values marked "placeholder" must be replaced with your own network.

lan:
  bridge: vmbr0             # the node bridge on the home LAN
  cidr: 192.168.1.0/24      # placeholder
  gateway: 192.168.1.1      # placeholder
  dns: 192.168.1.219        # Pi-hole on the DS224+ (upstream for the lab gateway)

storage:
  vm: local-zfs             # VM disks and container root filesystems (local-lvm on ext4 installs)
  files: local              # templates and disk images to import ("import" content enabled by Ansible)

# The Synology DS224+ as NFS storage for backups, ISOs and templates
# (terraform/nas.tf). Create the share and its NFS rule on the NAS
# first (docs/09-nas-and-control-node.md), then set enabled: true.
# Its address is the ds224 host in ansible/inventory/hosts.yml.
nas:
  enabled: false
  storage_id: nas
  export: /volume1/proxmox     # confirm with: pvesm nfsscan <nas address>
  options: vers=4.1            # DSM: File Services > NFS > Maximum NFS protocol = NFSv4.1
  content: [backup, iso, vztmpl]  # what pve-docs lists for NFS (import is not listed)
  backup:
    pools: [wallix]            # one weekly job per pool
    schedule: "sat 03:00"
    keep_last: 3
    keep_weekly: 4

# Lab segments shared by every node.
# type vlan:  tagged on vmbr0; the switch must pass 802.1Q tags.
# type vxlan: tunnelled between node IPs; any switch, but guest MTU 1450.
sdn:
  zone: lab
  type: vlan
  bridge: vmbr0
  vxlan_mtu: 1450
  vnets:
    pam: {tag: 10, alias: PAM lab}
    devops: {tag: 20, alias: DevOps lab}
    cyber: {tag: 30, alias: Cyber range - isolated}
    obs: {tag: 40, alias: Observability}

# Resource pools: one per lab plus infra, so permissions and views follow labs.
pools:
  infra: Shared lab infrastructure
  wallix: WALLIX PAM lab (WCE-P)
  devops: DevOps lab
  cyber: Cyber range

# The lab gateway container: DHCP/DNS for the lab vnets and routing to the LAN.
# Its LAN address is the labgw host in ansible/inventory/hosts.yml.
gateway:
  vmid: 110
  node: pve1
  hostname: labgw
  domain: lab.home.arpa       # guests register as <name>.lab.home.arpa
  snat_from_lan: false        # true for guests with a static IP and no default route
  # mgmt_cidr: 192.168.1.0/24  # who may reach the lab nets (default: lan.cidr)
  # One interface per entry, eth1, eth2... in this order. The cyber vnet is
  # deliberately absent: the gateway never routes it.
  nets:
    - vnet: pam
      address: 10.10.10.1/24
      dhcp: [10.10.10.100, 10.10.10.199]
      internet: false
    - vnet: obs                 # the observability VM; static address, no DHCP
      address: 10.10.40.1/24
      internet: true            # package installs for the stack

# The observability VM: Grafana Alloy, Loki, Prometheus and Grafana
# (terraform/observability.tf builds it; ansible/roles/observability configures it).
# Debian 13 cloud image + cloud-init, always on, in the infra pool.
observability:
  enabled: true
  vmid: 120
  node: pve2
  hostname: obs
  memory: 4096                  # the ceiling for the whole stack
  cores: 2
  disk_gb: 32
  vnet: obs
  address: 10.10.40.10/24
  # What the lab nets may send it through the gateway, and nothing else.
  collector:
    tcp: [514, 4318]            # syslog, OTLP over HTTP
    udp: [514]                  # syslog

# Guests per lab. VMID order is boot order for scripts/lab-ctl.sh.
# Each entry comes from scripts/ova-unpack.sh (make unpack OVA=...), which
# verifies an OVA and prints the values read from its OVF: vCPU, memory,
# firmware, MAC and each disk's real capacity. Paste it here, then set vmid
# (WALLIX lab range: 1000-1999), node and vnet.
labs:
  # The first lab: WALLIX, on the isolated pam segment. Empty until the
  # WALLIX OVAs are unpacked; then one entry per appliance or target, e.g.
  #   - vmid: 1001
  #     name: <from ova-unpack>
  #     node: pve1
  #     memory: <from ova-unpack>
  #     cores: <from ova-unpack>
  #     os: l26
  #     firmware: <from ova-unpack>
  #     vnet: pam
  #     disks:
  #       - image: artifacts/ova/<ova name>/<disk>.vmdk
  #         size_gb: <from ova-unpack>
  wallix:
    vms: []
